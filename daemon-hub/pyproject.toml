[project]
name = "cybernomicon-daemon-hub"
version = "0.1.0"
description = "Daemon Hub + Spell Engine for Project Cybernomicon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "websockets>=13", "pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
cybernomicon-hub = "cybernomicon.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["cybernomicon*"]
